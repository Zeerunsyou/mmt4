<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roblox Experience Controls</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #10131b; color: #f4f6fb;
      font: 16px system-ui, sans-serif;
    }
    main {
      width: min(520px, 92vw); padding: 28px; border: 1px solid #292f40;
      border-radius: 18px; background: #191e2a;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { color: #aab2c5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%; padding: 12px; border: 1px solid #353d52;
      border-radius: 9px; background: #10131b; color: white; font: inherit;
    }
    button {
      margin-top: 20px; padding: 12px 16px; border: 0; border-radius: 9px;
      background: #7c6cff; color: white; font: inherit; font-weight: 700;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap; padding: 14px; border-radius: 9px;
      background: #10131b; color: #c8d0e0;
    }
    #message { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Experience controls</h1>
    <p>Changes apply to your experience’s players when they spawn.</p>

    <label for="token">Dashboard API token</label>
    <input id="token" type="password" autocomplete="off" placeholder="Paste dashboard token">

    <label for="speed">Walk speed (8–32)</label>
    <input id="speed" type="number" min="8" max="32" value="16">

    <label for="jump">Jump power (25–100)</label>
    <input id="jump" type="number" min="25" max="100" value="50">

    <button id="save">Save settings</button>
    <button id="refresh">Refresh server status</button>
    <p id="message" role="status"></p>
    <h2>Latest Roblox server report</h2>
    <pre id="report">No report received yet.</pre>
  </main>

  <script>
    const API_URL = "https://YOUR-API-HOST.example";
    const tokenInput = document.querySelector("#token");
    const message = document.querySelector("#message");
    const report = document.querySelector("#report");

    async function api(path, options = {}) {
      const response = await fetch(`${API_URL}${path}`, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${tokenInput.value.trim()}`,
          ...options.headers
        }
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    document.querySelector("#save").onclick = async () => {
      try {
        const settings = {
          walkSpeed: Number(document.querySelector("#speed").value),
          jumpPower: Number(document.querySelector("#jump").value)
        };
        await api("/api/settings", {
          method: "PUT",
          body: JSON.stringify(settings)
        });
        message.textContent = "Settings saved.";
      } catch (error) {
        message.textContent = error.message;
      }
    };

    document.querySelector("#refresh").onclick = async () => {
      try {
        const data = await api("/api/report");
        report.textContent = JSON.stringify(data.report, null, 2);
        message.textContent = "Status updated.";
      } catch (error) {
        message.textContent = error.message;
      }
    };
  </script>
</body>
</html>
